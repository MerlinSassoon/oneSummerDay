<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>风之城</title>
  <!--script src="../jquery-3.7.1.js"></--script-->
  <link rel="stylesheet" href="script/basic_css.css" type="text/css"/>
  <link rel="stylesheet" href="script/combat_css.css" type="text/css"/>
  <script src="script/basic_functions.js" type="text/javascript"></script>
  <script src="script/combat_functions.js" type="text/javascript"></script>
  <script type="text/javascript">
    window.onload = async function(){
      var arr_buff = ["饿", "困", "伤", "毒", "幻"];
      IconGeneration(arr_buff, "buff栏", "buff");
      var arr_func = ["暧", "习", "烹", "图", "家"];
      IconGeneration(arr_func, "图标栏", "固定图标");

      await loadIndex();
      await loadMainText(START_SCENE);
      await loadSubText(["scene_mode", START_SCENE]);

      const oMainTextArea = document.getElementById("主文本区")
      oMainTextArea.addEventListener("click", await bigWorldInteraction, false);

      bindBF();
    }

    </script>
</head>
<body style="background-color: #f8f4e8; height: 719px;">
  <!--大世界特产：低于一定数量隐藏语句，使用元素视野才能继续采摘，完全采摘后会导致恢复时间加长，采摘场景是小游戏-->
  <div id="页头信息栏">
    <div id="个人信息" style="width: 65%; float: left;">
      <img src="图片素材/头.png" class="固定图标" style="float: left;"/>

      <div class="状态条"></div>
      <div class="状态条"></div>
      <div class="状态条"></div>

      <div id="buff栏" class="状态条" style="background-color: transparent;"></div>
    </div>
    <div id="图标栏" style="width: 35%; float: right;"></div>

    <div style="clear: both;"></div>
  </div>

  <div id="文本区">
    <div id="副文本区" class="文本区" style="width: 30%; height: 625px;"><!-- 系统栏位和行动滚屏的切换 -->
      <div id="副文本规则区" style="flex: none"></div>
      <div id="副文本行动区" style="display: flex; flex-direction: column; flex: auto; min-height: 0;">
        <div id="行动标题区" style="flex: none"><h2 style="margin: 5px 0px;">行动</h2></div>
        <div id="行动内容区" style="flex: auto; min-height: 0; overflow-y: auto; margin-bottom: 15px"></div>
      </div>
    </div>
    <div id="主文本区" class="文本区" style="width: 67.2%; height: 625px;">
      <div id="主文本标题区" style="flex: none;"></div>
      <div id="主文本内容区" style="flex: auto; min-height: 0; overflow-y: auto;"></div>
      <div id="主文本跳转区" style="flex: none; margin-top: auto;"></div>
    </div>
  </div>

</body>
</html>
